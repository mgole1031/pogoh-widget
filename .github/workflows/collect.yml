name: Collect station data

# Each run polls every 2 min for ~5h40m, pushing CSVs every 30 min, then exits.
# The hourly schedule + concurrency group keeps one run queued, so the next run starts
# as soon as the current one ends -> near-continuous coverage (small gap at each handover).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        env:
          INTERVAL: "120"
          MAX_MINUTES: "340"
          COMMIT_EVERY: "30"
          # Stops collecting after this (UTC). Change or blank it to run longer.
          STOP_AFTER: "2026-11-10T05:00:00Z"
        run: |
          git config user.name "pogoh-collector"
          git config user.email "actions@users.noreply.github.com"
          python3 collector/collect.py
