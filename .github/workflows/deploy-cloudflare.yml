name: Deploy collector (Cloudflare)

# Deploys cloudflare/ as a Worker that polls POGOH every minute and stores changes in D1.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, EXPORT_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$EXPORT_TOKEN" ]; then
            echo "::error::Add repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and EXPORT_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install wrangler
        run: npm i -g wrangler@4.156.2

      - name: Create database (first run only) and apply schema
        run: |
          get_id() { wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="pogoh") | .uuid' | head -1; }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            wrangler d1 create pogoh
            ID=$(get_id)
          fi
          [ -n "$ID" ] || { echo "::error::could not find/create D1 database"; exit 1; }
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute pogoh --remote --file schema.sql

      - name: Deploy worker
        run: |
          wrangler deploy | tee deploy.log
          printf '%s' "$EXPORT_TOKEN" | wrangler secret put EXPORT_TOKEN
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Collector deployed" >> $GITHUB_STEP_SUMMARY
          echo "Health: ${URL}/health" >> $GITHUB_STEP_SUMMARY
